regulatory_context:
  note: >-
    Belharra Therapeutics is a preclinical-stage biotechnology company running a chemoproteomics
    drug-discovery platform under partnership with Genentech and Sanofi. It is subject to FDA
    regulation of any investigational product it advances, but that is drug-development regulation,
    not API or data-processing regulation, and it confers nothing on the public content API
    catalogued here. The site publishes a Privacy Policy and Terms of Use; neither describes an
    API, a data-processing agreement or a compliance certification. No HIPAA, GDPR, SOC 2 or ISO
    27001 claim is published anywhere on the public surface, and none is asserted on the company's
    behalf. Belharra has no marketed product, no patient-facing service and no clinical trial of
    its own listed on the site, so no clinical-data regime attaches.
