aid: belharra-therapeutics
name: Belharra Therapeutics
description: >-
  Belharra Therapeutics is a privately held, next-generation chemoproteomics company headquartered at
  3985 Sorrento Valley Boulevard, Suite C, San Diego, California, that is building small molecule
  therapeutics against targets the industry has long considered undruggable. Its Searchlight platform
  is an unbiased chemoproteomics screening system designed to illuminate novel, previously invisible
  binding pockets on high-value proteins across the proteome — the company states it can identify
  small molecule binders for any binding site, on any protein, in any conformational state, in any
  cell type, and reported having identified more than four thousand drug-like pocket probes by
  January 2024. The company was incubated and supported by Versant Ventures out of foundational
  chemoproteomics research at The Scripps Research Institute, with co-founders including Christopher
  G. Parker and Benjamin Cravatt of Scripps Research and Stuart Schreiber of the Broad Institute of
  MIT and Harvard. Jeff Jonker was hired as chief executive officer in September 2021, and the
  company debuted publicly in January 2023 with $130 million in hand — a $50 million Series A led by
  Versant Ventures plus an $80 million upfront payment from a multi-year Genentech collaboration
  spanning oncology, immuno-oncology, autoimmune and neurodegenerative disease. In June 2024 it
  announced a strategic immunology collaboration with Sanofi carrying up to $40 million in upfront
  and near-term milestone payments, and in January 2025 it appointed Sean Buchanan as chief
  scientific officer. Belharra runs no developer program and publishes no product API, developer
  portal, API reference, or SDK. The only machine-readable surface reachable without credentials is
  the WordPress REST content API behind belharratx.com, catalogued here.
