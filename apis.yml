apis:
- aid: belharra-therapeutics:belharra-therapeutics-content-api
  name: Belharra Therapeutics Content API
  description: >-
    The anonymously readable WordPress REST API behind belharratx.com. It exposes the company's
    editorial and corporate content: four press releases spanning the January 2023 $130 million
    debut and Genentech collaboration, the June 2024 Sanofi immunology collaboration and the
    January 2025 chief scientific officer appointment; twenty-one company-news items; ten blog
    posts across the Company News and Press Releases categories; ten multimedia-file records; the
    twenty-nine published corporate pages (About, Our Story, Our Values, Our Team with Leadership,
    Founders, Board of Directors, Senior Advisors and BTX Crew, Our Approach with Platform and
    Publications, Science, Program, Partners, Patients, Careers, Newsroom, Podcast, Multimedia
    Library, Contact, Privacy and Terms); the 430-item media library; the two news categories; the
    registered post types, taxonomies and post statuses; cross-content search across 74 records;
    and the oEmbed 1.0 provider endpoint. This is not a developer product Belharra markets; it is
    the site's own content surface, registered at /wp-json/ and verified to return data without
    credentials. The OpenAPI in this repo is derived from the published route index.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://belharratx.com/wp-json
