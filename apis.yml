  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://belharratx.com/wp-json/ — 198 routes across 11 namespaces (oembed/1.0,
    wpe/cache-plugin/v1, wpe_sign_on_plugin/v1, contact-form-7/v1, redirection/v1, podcastplayer/v1,
    duplicate-post/v1, wp/v2, wp-site-health/v1, wp-block-editor/v1, wp-abilities/v1) — and verified
    against live anonymous responses on 2026-08-06. Only operations that returned data without
    credentials are modelled; every write route and the entire plugin-administration surface is
    excluded. Anonymous denials recorded at harvest: /wp/v2/settings, /wp/v2/menus,
    /wp/v2/menu-locations, /wp/v2/themes, /wp/v2/plugins, /wp/v2/block-types,
    /wp/v2/font-collections, /wp/v2/icons, /wp/v2/sidebars, /wp/v2/widget-types, /wp/v2/templates,
    /wp/v2/template-parts, /wp/v2/global-styles, /wp/v2/block-patterns/*,
    /wp/v2/pattern-directory/patterns, /wp-site-health/v1/*, /podcastplayer/v1/* (401) and
    /wp/v2/comments (403 rest_comment_disabled), /contact-form-7/v1/contact-forms (403
    wpcf7_forbidden). Notably the site registers the WordPress Abilities API (wp-abilities/v1), an
    agent-facing capability registry, but every wp-abilities/v1 route returned 401 rest_forbidden
    anonymously, so no MCP or agent surface is claimed for this provider and no MCPServer pointer is
    emitted. The site is served by WP Engine behind Cloudflare and sets x-robots-tag: noindex on API
    responses. Belharra publishes no developer documentation, no API reference, no getting-started
    guide and no support channel for this surface, so no Documentation / APIReference /
    GettingStarted pointers are emitted; the humanURL above is the upstream WordPress REST handbook
    that defines the wp/v2 contract.
