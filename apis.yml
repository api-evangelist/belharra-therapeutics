  state: covered
  reason: machine-readable-contract-harvested
  detail: >-
    Belharra Therapeutics runs no developer program and markets no product API, but it does serve a
    real machine-readable contract anonymously — the 198-route WordPress REST index at
    https://belharratx.com/wp-json/, verified route by route and modelled into a 22-operation
    OpenAPI. The harvest stub's Website pointer was wrong (it pointed at nasdaqprivatemarket.com,
    the harvest source); the real corporate host is belharratx.com. The alias domain
    belharratherapeutics.com is a parked lander that answers 200 on every path including
    /.well-known/agent-card.json and /openapi.json, and was rejected as a soft-404 against a
    nonsense control path.
  evidence:
