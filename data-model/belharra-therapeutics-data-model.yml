note: >-
  The entity-relationship graph of the Belharra Therapeutics content API, derived from the OpenAPI
  schemas, the id-reference fields on live responses, and the HAL-style `_links` relations
  WordPress attaches to every resource. Belharra publishes no object reference of its own. The
  notable shape here is that all three of Belharra's custom post types are FLAT — none declares a
  taxonomy, none carries an author or excerpt, and each relates outward only through
  featured_media. Editorial structure that would normally live in taxonomy terms lives instead in
  the untyped `acf` payload.
entities:
- name: Post
  rest_base: posts
  schema: '#/components/schemas/Post'
  count_at_harvest: 10
  identity: {field: id, type: integer}
  description: >-
    The blog/news archive. Categorised into Company News (7) and Press Releases (3). Spans
    2023-01-04 to 2024-06-18.
- name: Page
  rest_base: pages
  schema: '#/components/schemas/Page'
  count_at_harvest: 29
  identity: {field: id, type: integer}
  description: >-
    The corporate site. Self-referentially hierarchical via `parent` — /about/ parents Our Story,
    Our Values and Our Team, which in turn parents Leadership, Founders, Board of Directors, Senior
    Advisors and BTX Crew; /our-approach/ parents Platform and Publications; /science/ parents
    Program and Our Science.
- name: PressRelease
  rest_base: press-release
  schema: '#/components/schemas/CustomPost'
  count_at_harvest: 4
  identity: {field: id, type: integer}
  description: >-
    Belharra's own announcements — the January 2023 $130M debut, the January 2023 Genentech
    collaboration, the June 2024 Sanofi collaboration and the January 2025 CSO appointment.
- name: CompanyNewsItem
  rest_base: company-news
  schema: '#/components/schemas/CustomPost'
  count_at_harvest: 21
  identity: {field: id, type: integer}
  description: Third-party press coverage ("In the News"). Outbound article links live in `acf`.
- name: MultimediaFile
  rest_base: multimedia-file
  schema: '#/components/schemas/CustomPost'
  count_at_harvest: 10
  identity: {field: id, type: integer}
  description: >-
    Curated video and podcast records backing the Multimedia Library, including the "Birth of a
    Biotech" podcast series. Media references live in `acf`.
- name: MediaItem
  rest_base: media
  schema: '#/components/schemas/MediaItem'
  count_at_harvest: 430
  identity: {field: id, type: integer}
  description: >-
    The attachment library. Carries source_url, mime_type, filesize, alt_text and a media_details
    block holding the generated size variants.
- name: Term
  rest_base: categories | tags
  schema: '#/components/schemas/Term'
  count_at_harvest: 2
  identity: {field: id, type: integer}
  description: >-
    Taxonomy terms. Only two exist, both in the `category` taxonomy — Company News (id 1, count 7)
    and Press Releases (id 7, count 3). The `post_tag` taxonomy is registered but empty.
- name: Author
  rest_base: users
  schema: '#/components/schemas/Author'
  count_at_harvest: 3
  identity: {field: id, type: integer}
  description: >-
    The public author projection. Anonymously readable on this deployment (unlike many WordPress
    sites, which 401 this collection), but limited to id, name, url, description, link, slug and
    avatar_urls. No emails, roles or capabilities are exposed.
relationships:
- from: Post
  to: Author
  kind: belongs_to
  via: author
  link_rel: author
- from: Post
