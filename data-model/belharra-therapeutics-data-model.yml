- from: SearchResult
  to: [Post, Page, PressRelease, CompanyNewsItem, MultimediaFile]
  kind: polymorphic_reference
  via: subtype
  note: >-
    Resolve `subtype` to a rest_base via /wp/v2/types, then GET /wp/v2/{rest_base}/{id}. For all
    five subtypes on this deployment the subtype string IS the rest_base, but that is a property of
    this installation and should be confirmed from /wp/v2/types rather than assumed.
id_conventions:
  scheme: WordPress auto-increment integers
  shared_sequence: >-
    Posts, pages, media and all three custom post types draw from a single wp_posts ID sequence, so
    an ID is globally unique across those six collections but is NOT scoped per type — requesting a
    valid page ID on /wp/v2/posts/{id} returns 404 rest_post_invalid_id.
  taxonomy_sequence: >-
    Terms use a separate wp_terms sequence, so term id 1 and post id 1 are unrelated.
  prefixes: none
untyped_surface:
  field: acf
  present_on: [Post, Page, MediaItem, Term, Author, PressRelease, CompanyNewsItem, MultimediaFile]
  detail: >-
    An Advanced Custom Fields payload is inlined on every resource. It is schemaless from the
    consumer's point of view — the field keys are defined in the WordPress admin, which is
    401-gated — and it is where Belharra's real editorial structure lives: outbound coverage URLs
    on company-news, video and podcast references on multimedia-file, and the team/pipeline block
    content on pages. It is modelled as `additionalProperties: true` in the OpenAPI rather than
    guessed at, because the field definitions are not publicly readable.
